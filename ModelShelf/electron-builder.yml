appId: com.modelshelf.app
productName: ModelShelf
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
mac:
  target: dmg
  icon: build/icon.icns
win:
  target: nsis
  icon: build/icon.ico
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: ModelShelf
  createDesktopShortcut: true
  createStartMenuShortcut: true
